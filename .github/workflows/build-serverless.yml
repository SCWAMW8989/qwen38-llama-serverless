# .github/workflows/build-serverless.yml  (v1_2, untested, best-effort)
# Builds Dockerfile.serverless (model baked in) and pushes it to Docker Hub.
name: Build serverless image

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Your existing llama.cpp CUDA image, e.g. youruser/qwen38-llama:v1"
        required: true
      quant:
        description: "Quant to bake in"
        required: true
        default: "Q5_K_M-multilingual-mtp"
      tag:
        description: "Tag for the new image"
        required: true
        default: "q5km-mtp-v1"
      with_vision:
        description: "Bake in the vision projector? 1 = yes, 0 = text only"
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the image is about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          FREE_GB=${FREE_GB:-0}
          echo "Free: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 45 ]; then
            echo "::warning::Only ${FREE_GB} GB free (guide says 45 GB)." \
                 "The build will probably run out of disk." \
                 "Use the laptop build (4A) or Option B (4C)."
          fi

      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --build-arg QUANT="${{ inputs.quant }}" \
            --build-arg WITH_VISION="${{ inputs.with_vision }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/qwen38-llama-serverless:${{ inputs.tag }}" \
            -f Dockerfile.serverless .

      - name: Push
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/qwen38-llama-serverless:${{ inputs.tag }}"
