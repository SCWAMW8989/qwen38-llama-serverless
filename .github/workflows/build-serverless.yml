# .github/workflows/build-serverless.yml  (v1_3)
# Builds Dockerfile.serverless (model baked in) and pushes it to Docker Hub.
#
# v1_3 changes:
#   - Default base image is now the real Pod image. The old default
#     (scwamw89/qwen38-llama-serverless:recent) does not exist, so any run
#     left on defaults failed at the FROM line.
#   - New "Check inputs" step fails in seconds, with a plain message, if the
#     base image or the model file name is wrong.
#   - Removed the credential debug step.
#   - The build and push commands are unchanged from v1_2.
name: Build serverless image

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Pod image to build on. Leave the default unless you pushed the Pod image under a new tag."
        required: true
        default: "scwamw89/qwen-heretic-runpod:latest"
      quant:
        description: "Quant to bake in. Must match a RVN-(quant).gguf file on Hugging Face."
        required: true
        default: "Q5_K_M-multilingual-mtp"
      tag:
        description: "Tag for the new image"
        required: true
        default: "q5km-mtp-v1"
      with_vision:
        description: "Bake in the vision projector? 1 = yes, 0 = text only"
        required: true
        type: choice
        options:
          - "1"
          - "0"
        default: "1"

env:
  HF_REPO: 0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF
  KNOWN_GOOD_BASE: scwamw89/qwen-heretic-runpod:latest
  BASE_IMAGE: ${{ inputs.base_image }}
  QUANT: ${{ inputs.quant }}
  TAG: ${{ inputs.tag }}
  WITH_VISION: ${{ inputs.with_vision }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check inputs (fails fast with a plain message)
        run: |
          set -euo pipefail

          # A serverless image already has a ~20 GB model baked in. Building
          # on top of one stacks a second model and runs the runner out of disk.
          case "$BASE_IMAGE" in
            *qwen38-llama-serverless*)
              echo "::error::base_image is a serverless image that already contains a model. Use the Pod image instead: ${KNOWN_GOOD_BASE}"
              exit 1
              ;;
          esac

          if ! docker buildx imagetools inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "::error::Base image '${BASE_IMAGE}' was not found on Docker Hub. The known-good one is ${KNOWN_GOOD_BASE}"
            exit 1
          fi
          echo "Base image found: ${BASE_IMAGE}"

          URL="https://huggingface.co/${HF_REPO}/resolve/main/RVN-${QUANT}.gguf"
          CODE="$(curl -sI -o /dev/null -w '%{http_code}' "$URL" || true)"
          case "$CODE" in
            2*|3*)
              echo "Model file found: RVN-${QUANT}.gguf"
              ;;
            401|403|404)
              echo "::error::No file RVN-${QUANT}.gguf in ${HF_REPO} (HTTP ${CODE}). Check the quant name."
              exit 1
              ;;
            *)
              echo "::warning::Could not confirm RVN-${QUANT}.gguf on Hugging Face (HTTP ${CODE}). Continuing; the build will fail later if the name is wrong."
              ;;
          esac

      - name: Free disk space (the image is about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          FREE_GB=${FREE_GB:-0}
          echo "Free: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 45 ]; then
            echo "::warning::Only ${FREE_GB} GB free (guide says 45 GB)." \
                 "The build will probably run out of disk." \
                 "Use the laptop build (4A) or Option B (4C)."
          fi

      - name: Build
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg QUANT="${QUANT}" \
            --build-arg WITH_VISION="${WITH_VISION}" \
            -t "${DOCKERHUB_USERNAME}/qwen38-llama-serverless:${TAG}" \
            -f Dockerfile.serverless .

      - name: Push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker push "${DOCKERHUB_USERNAME}/qwen38-llama-serverless:${TAG}"
